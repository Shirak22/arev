<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/new-tab.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/toaster.css">

    <title>Arev</title>
</head>

<body>
    <section id="main-container" class="settings-container">
        <main id="weather-container">
            <header id="weather-header">
                <h3 class="settings-title">Settings</h3>

            </header>
            <section id="settings-content">
                <h3 class="settings-title"><span><svg xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                            <path
                                d="M128 252.6C128 148.4 214 64 320 64C426 64 512 148.4 512 252.6C512 371.9 391.8 514.9 341.6 569.4C329.8 582.2 310.1 582.2 298.3 569.4C248.1 514.9 127.9 371.9 127.9 252.6zM320 320C355.3 320 384 291.3 384 256C384 220.7 355.3 192 320 192C284.7 192 256 220.7 256 256C256 291.3 284.7 320 320 320z" />
                        </svg></span>Location</h3>
                <section class="settings-content-container">
                    <section class="settings-location-container">
                    
                    </section>

                    <div class="settings-location-buttons-container">
                        <div class="settings-location-checkbox-container">
                            <input type="checkbox" id="settings-location-checkbox" checked>
                            <label for="settings-location-checkbox" >Auto</label>
                          
                        </div>
                        <button class="settings-get-location-button">
                            <img src="assets/icons/svg/refresh.svg" alt="get location Icon">
                            Get current location</button>
                        <button class="settings-manual-button">
                            <img src="assets/icons/svg/position.svg" alt="Manual Icon">
                            Use geolocation</button>
                    </div>
                    <div class="settings-settings-buttons-container">
                        <button class="settings-about-button">About</button>
                        <button class="settings-terms-button">Credits</button>
                    </div>
                </section>
            </section>
            <footer id="settings-footer">
                <img src="assets/logo/icon_512.png" alt="Arev Logo">
                <p class="settings-footer-text">© 2025 Shirak Soghomonian</p>
                <div class="settings-footer-buttons-container">
                    <a class="settings-footer-buttons-container-link" href="privacy.html">Privacy</a>
                </div>
            </footer>
        </main>
    </section>
    <div class="toaster"></div>
    <script src="js/settings.js" type="module" ></script>
</body>

</html>
