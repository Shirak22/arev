<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arev</title>
</head>
<body>
        <h1>Arev weather extension new tab</h1>
        <button id="cache-purge-button" >Purge Cache</button>
        <div id="weather-container">
            <h1>Weather</h1>
            <p>Temperature: <span id="temperature"></span></p>
            <p>Weather: <span id="weather"></span></p>
            <p>Humidity: <span id="humidity"></span></p>
            <p>Wind Speed: <span id="wind-speed"></span></p>
            <p>Wind Direction: <span id="wind-direction"></span></p>
            <p>Wind Gust: <span id="wind-gust"></span></p>
            <p>Wind Chill: <span id="wind-chill"></span></p>
            <p>Wind Chill: <span id="wind-chill"></span></p>
        </div>

        
        <script src="js/new-tab.js" type="module"></script>
        <script src="js/cache-purge.js" type="module"></script>
       
</body>
</html>
