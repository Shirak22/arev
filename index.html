<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/new-tab.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&display=swap" rel="stylesheet">
    <title>Arev</title>
</head>
<body>
      <section id="main-container">
        <main id="weather-container">
                <!-- 3 days forecast -->
                <section class="weather-forecast">
                    <section class="weather-forecast-days">
                    </section>
                    <p class="weather-forecast-title">3 days <span>forecast</span></p>
    
                 </section>
            <header id="weather-header">
                <h3 class="location-city"></h3>
                <p class="weather-time"></p>
            </header>
            <section id="weather-content">
                <!-- weather icons -->
                 <section class="weather-icons">
                    <img src="assets/icons/svg/star.svg" alt="Loading..." class="weather-icon">
                    <h3 class="weather-description"></h3>
                 </section>
                 <!-- weather temperature -->
                 <section class="weather-temperature">
                    <h1 class="weather-temperature-value"></h1>
                    <p>Feels like <span class="weather-temperature-feels-like"></span></p>
                    <div class="weather-temperature-details">
                        <p>wind speed <span class="weather-temperature-wind-speed-value"></span></span> </p>
                        <p>humidity <span class="weather-temperature-humidity-value"></span></span></p>
                    </div>
                 </section>
            </section>
            <footer id="weather-footer">
                <!-- clothes recommendation -->
                 <p class="clothes-recommendation">Loading...</p>
            </footer>

        <!--  Photograph credits -->
          
        </main>
    
        <section id="photograph-credits">
            <a class="photograph-credits-link" target="_blank">
                <p>photograph by <span class="photograph-credits-name"></span></p>
            </a>
          </section>
      </section>

        <script src="js/render/event-listener.js" type="module"></script>
        <script src="js/init.js" type="module"></script>
       
</body>
</html>
